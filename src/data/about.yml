about:
  name: Amrit Anand Gandhi
  title: Application Developer
  description: |
    Amrit Anand Gandhi is a Senior Frontend Engineer with 10+ years of experience building scalable, high-performance web applications using React, TypeScript, JavaScript, GraphQL, and modern frontend technologies.
    
    He specializes in frontend architecture, reusable component systems, state management, performance optimization, and building maintainable applications that scale across large codebases. His expertise includes designing robust user interfaces, optimizing GraphQL data flows, implementing testing strategies, and establishing engineering best practices that improve code quality and developer productivity.

    Passionate about clean architecture and modern web engineering, he enjoys solving complex UI challenges, simplifying systems, and creating digital experiences that are fast, reliable, and intuitive.

    Follow Amrit on Linkedin or GitHub.
